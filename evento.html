<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Evento — PartiuFloripa</title>
<meta name="description" content="Detalhes de eventos em Florianópolis no PartiuFloripa">
<meta name="robots" content="noindex,follow">
<style>
:root{font:15px system-ui,-apple-system,"Segoe UI",sans-serif;background:#09151a;color:#edf6f5;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
a{color:inherit}
a:focus-visible{outline:3px solid #f5d78f;outline-offset:5px}
.site-head{max-width:1140px;margin:auto;padding:18px clamp(18px,3vw,30px)}
.brand{font-weight:900;letter-spacing:-.8px;text-decoration:none;color:#fff;font-size:20px}
.brand span{color:#4ce3b3}
.wrap{max-width:1140px;margin:0 auto;padding:0 clamp(18px,3vw,30px) 64px}
.back{display:inline-block;color:#d2e8df;text-decoration:none;font-weight:700;font-size:14px;margin:7px 0 19px}
.back:hover{text-decoration:underline}
.event-panel{border:1px solid #385459;background:#101f24;border-radius:24px;overflow:hidden}
.hero{min-height:340px;position:relative;isolation:isolate;overflow:hidden;padding:30px clamp(22px,5vw,58px) 33px;
 background:radial-gradient(ellipse at 96% 15%,#4b7472,transparent 55%),linear-gradient(120deg,#2e5054,#244047 70%);
 color:#fff9e9;display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.hero:after{content:"";position:absolute;z-index:-1;border:2px solid currentColor;opacity:.13;width:420px;height:420px;border-radius:44% 56% 61% 39%;right:-120px;bottom:-190px;box-shadow:0 0 0 28px #ffffff14,0 0 0 58px #ffffff12,0 0 0 88px #ffffff0e;transform:rotate(-18deg)}
.overline,.kicker{font-size:11px;letter-spacing:2px;font-weight:850;text-transform:uppercase}
.overline{display:flex;gap:12px;align-items:center;letter-spacing:2.7px}
.overline:before{content:"";height:2px;width:28px;background:currentColor;flex:none}
.hero h1{font:italic 800 clamp(49px,8.5vw,110px)/.99 Georgia,serif;letter-spacing:-.07em;overflow-wrap:anywhere;max-width:900px;margin:18px 0 12px}
.hero-bottom{display:flex;align-items:end;justify-content:space-between;flex-wrap:wrap;gap:24px}
.hero-bottom strong{display:block;font-size:clamp(15px,2vw,22px);margin-top:7px;font-weight:850;line-height:1.2}
.hero-art{display:flex;align-items:center;gap:19px}
.hero-thumbnail{width:110px;height:110px;object-fit:cover;border:3px solid #f5d78f;border-radius:6px;box-shadow:0 6px 18px #09141a70}.hero-art{align-items:center}.photo-caption{font-size:12px;line-height:1.5;color:#e1ebe6;margin:10px 0}.photo-caption a{color:#f5d78f}.hero-art .emoji{font-size:clamp(34px,6vw,55px)}
.hero-art .number{font-size:clamp(60px,8vw,98px);line-height:.82;font-weight:900;color:#f5d78f;letter-spacing:-7px}
.content{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,.78fr);gap:clamp(26px,4vw,56px);
 padding:clamp(23px,4vw,50px);border-top:4px solid #f5d78f;color:#f5f7f1}
.content>section,.content>aside{min-width:0}
.kicker{color:#f5d78f}
.content h2{font-size:clamp(23px,3vw,36px);letter-spacing:-.045em;margin:9px 0 18px;line-height:1.18;color:#fffdf5}
.time{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #52717a;padding:16px 0;gap:12px}
.time span{font-size:14px;color:#e1ebe6}
.time strong{font-size:clamp(24px,3.5vw,40px);color:#fffdf5;font-variant-numeric:tabular-nums;white-space:nowrap}
.location{padding:21px 0}
.location strong{display:block;font-size:clamp(20px,3vw,26px);margin:8px 0;overflow-wrap:anywhere}
.location small{display:block;font-size:13px;color:#e1ebe6;line-height:1.5}
.secondary{border-top:1px solid #52717a;padding:15px 0;color:#e1ebe6}
.secondary strong{color:#fffdf5}
.secondary .label{font-size:12px;display:block;margin-bottom:6px}
.note{color:#e7f1ec;line-height:1.65}
.context{color:#e7f1ec;line-height:1.6}
.cta{display:block;text-align:center;background:#f5d78f;color:#122a2b;text-decoration:none;padding:16px 19px;border-radius:3px;font-weight:900;margin-top:24px}
.cta:hover{background:#ffe9aa}
.disclosure,.footer-note{font-size:12px;line-height:1.65;color:#e1ebe6}
.disclosure{margin-top:17px}
.footer-note{opacity:.9}
.notice{border-left:3px solid #f5d78f;padding:10px 12px;margin:13px 0;background:#183138;color:#eaf5ed;line-height:1.5;font-size:13px}
.notice.warning{border-color:#f3b77d;background:#392d24;color:#ffe5bf}
.error{padding:28px;color:#fff5e8}
@media(max-width:700px){.content{grid-template-columns:minmax(0,1fr)}.hero{min-height:345px}.hero h1{font-size:clamp(49px,12vw,86px)}.hero-art .number{font-size:65px}.content h2{margin-bottom:8px}}
@media(max-width:380px){.hero-art{gap:12px}.hero-art .number{font-size:55px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="site-head"><a class="brand" href="./index.html" aria-label="PartiuFloripa, voltar à agenda">partiu<span>floripa.</span></a></header>
<main class="wrap">
<a class="back" href="./index.html">← Voltar à agenda</a>
<div id="detail" class="event-panel" aria-live="polite"><p class="error">Carregando evento...</p></div>
</main>
<script src="./scripts/media-selection.js"></script><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icons={"Baladas":"🪩","Shows":"🎤","Humor":"😂","Teatro":"🎭","Cinema":"🎬","Dança":"💃","Festivais":"🎪","Feiras":"🛍️","Cultura":"📚"};
const qs=new URLSearchParams(location.search);
const id=qs.get("id")||document.documentElement.dataset.eventId,date=qs.get("date"),title=qs.get("title"),venue=qs.get("venue");
const backLink=document.querySelector(".back");
if(qs.get("back")==="map"&&/^\d{4}-\d{2}-\d{2}$/.test(qs.get("date")||"")&&/^[a-z0-9:_ -]{1,128}$/.test(qs.get("popup")||"")){
 const home=new URL("./index.html",document.baseURI);
 home.searchParams.set("view","map");
 home.searchParams.set("date",qs.get("date"));
 home.searchParams.set("popup",qs.get("popup"));
 const lat=Number(qs.get("lat")),lng=Number(qs.get("lng")),zoom=Number(qs.get("zoom"));
 if(qs.has("lat")&&qs.has("lng")&&lat>=-28&&lat<=-27&&lng>=-49&&lng<=-48.2&&Number.isInteger(zoom)&&zoom>=8&&zoom<=16){
  home.searchParams.set("lat",String(lat));
  home.searchParams.set("lng",String(lng));
  home.searchParams.set("zoom",String(zoom));
 }
 if(/^\d{1,5}$/.test(qs.get("scroll")||""))home.searchParams.set("scroll",qs.get("scroll"));
 backLink.href=home.href;
 backLink.textContent="← Voltar ao mapa";
}else{
 // In regular browsing, the actual previous page keeps month, search, scroll and tab state.
 backLink.addEventListener("click",event=>{
  try{
   const from=new URL(document.referrer);
   const home=new URL("./index.html",document.baseURI);
   const rootPath=home.pathname.replace(/index\.html$/,"");
   if(from.origin===location.origin&&(from.pathname===home.pathname||from.pathname===rootPath)&&history.length>1){
    event.preventDefault();history.back();
   }
  }catch{}
 });
}
const detail=document.getElementById("detail");
let mediaRegistry={categoryPhotos:{items:[]},venueMedia:{items:[]},eventPhotos:{assets:[]},imageRights:{assets:[]}};
function notice(message,warning=false){return '<p role="note" class="notice'+(warning?' warning':'')+'">'+esc(message)+'</p>'}
function show(e){
 document.title=e.title+" — PartiuFloripa";
 const emoji=icons[e.category]||"📅";
 const visual=PartiuMedia.select(e,mediaRegistry);
 const day=new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"long",weekday:"long",timeZone:"UTC"}).format(new Date(e.date+"T12:00:00Z"));
 const shortDate=new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"short",weekday:"long",timeZone:"UTC"}).format(new Date(e.date+"T12:00:00Z")).toUpperCase();
 const reviewed=e.status==="verified",quarantined=e.sourceReview==="quarantined";
 const sourceUrl=typeof e.source==="string"&&/^https:\/\//.test(e.source)?e.source:null;
 const validLocation=!!e.venue&&e.venue!=="Local a confirmar";
 const validRegion=!!e.region&&e.region!=="Florianópolis";
 const uncertain=[];
 if(!e.time)uncertain.push("Horário não confirmado");
 if(!validLocation)uncertain.push("Local não confirmado");
 if(!validRegion)uncertain.push("Bairro não confirmado");
 const warnings=[
  !reviewed?notice("Registro experimental: as informações ainda não foram verificadas individualmente."): "",
  uncertain.length?notice(uncertain.join(" · "),true):"",
  quarantined?notice("Fonte sob revisão editorial. Confirme diretamente com o organizador antes de sair.",true):""
 ].join("");
 const timeRows='<div class="time"><span>'+esc(e.showTime?"Abertura do evento":"Horário informado")+'</span><strong>'+esc(e.time||"A confirmar")+'</strong></div>'+
 (e.showTime?'<div class="time"><span>Início da atração</span><strong>'+esc(e.showTime)+'</strong></div>':"");
 const venueHtml='<div class="location"><div class="kicker">Onde acontece</div><strong>'+esc(validLocation?e.venue:"Local a confirmar")+'</strong><small>'+esc(validRegion?e.region:"Bairro a confirmar")+' · Florianópolis</small></div>';
 const ticketHtml=e.price?'<div class="secondary"><span class="label">Ingressos / valores informados</span><strong>'+esc(e.price)+'</strong></div>':"";
 const source=sourceUrl&&reviewed&&!quarantined?'<a class="cta" href="'+esc(sourceUrl)+'" target="_blank" rel="noopener noreferrer">Conferir informações ↗</a>':'';
 const more=e.note?'<p class="note">'+esc(e.note)+'</p>':"";
 detail.innerHTML='<section class="hero" aria-labelledby="event-title"><div class="overline">PartiuFloripa / '+esc(e.category||"Eventos")+'</div><h1 id="event-title">'+esc(e.title)+'</h1><div class="hero-bottom"><div><div class="kicker">'+esc(e.category||"Evento")+' · Florianópolis</div><strong>'+esc(shortDate)+'</strong></div><div class="hero-art"><img class="hero-thumbnail" src="'+esc(visual.file)+'" alt="Foto ilustrativa ou de arquivo" loading="eager"><span class="number" aria-hidden="true">'+esc(e.date.slice(8,10))+'</span></div></div></section>'+
 '<div class="content"><section aria-labelledby="info-heading"><div class="kicker">Informações do evento</div><h2 id="info-heading">O que você precisa saber</h2>'+timeRows+venueHtml+ticketHtml+more+'</section>'+
 '<aside aria-labelledby="source-heading"><div class="kicker">Informações e ingressos</div><h2 id="source-heading">Confira os detalhes</h2><p class="context">Consulte a fonte antes de sair. Horários, disponibilidade e ingressos podem mudar.</p>'+warnings+source+
 ''+(visual.kind==="artist"?'<p class="photo-caption">Foto de arquivo do artista, não desta apresentação em Florianópolis. <a target="_blank" rel="noopener noreferrer" href="'+esc(visual.sourceUrl)+'">Crédito e licença ↗</a></p>':visual.kind==="illustrative"?'<p class="photo-caption">Foto ilustrativa. <a href="./creditos.html">Crédito ↗</a></p>':'<p class="disclosure">Arte de categoria ilustrativa, sem representar um cartaz oficial.</p>')+'<p class="footer-note">O PartiuFloripa não vende ingressos.</p></aside></div>';
}
Promise.all(["./events.json","./data/venue-media.json","./data/event-artist-photos.json","./data/licensed-category-photos.json","./data/image-rights.json"].map(url=>fetch(url).then(r=>{if(!r.ok)throw Error("Falha "+url);return r.json()}))).then(([data,venueMedia,eventPhotos,categoryPhotos,imageRights])=>{mediaRegistry={venueMedia,eventPhotos,categoryPhotos,imageRights};
 const e=data.events.find(x=>id?x.id===id:(x.date===date&&x.title===title&&x.venue===venue));
 if(!e){detail.innerHTML='<p class="error">Evento não encontrado. <a href="./index.html">Voltar à agenda</a>.</p>';return}
 if(!/^https:\/\//.test(e.source)){detail.innerHTML='<p class="error">Fonte do evento indisponível.</p>';return}
 show(e);
}).catch(()=>{detail.innerHTML='<p class="error">Não foi possível carregar os detalhes. Tente novamente.</p>'});
</script>
</body>
</html>
