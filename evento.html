<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Evento — PartiuFloripa</title><meta name="description" content="Detalhes de eventos em Florianópolis no PartiuFloripa"><meta name="robots" content="noindex,follow"><style>
:root{font-family:Inter,system-ui,sans-serif;color:#f0f3f7;background:#0c151b}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:0 20px}header{background:#0b1218;border-bottom:1px solid #30424a;padding:20px 0}.brand{text-decoration:none;font-size:24px;font-weight:900;letter-spacing:-1px;color:white}.brand span{color:#5ce5ba}main{padding-top:28px;padding-bottom:70px}.back{display:inline-block;color:#c9f48a;margin-bottom:24px;text-decoration:none}.panel{background:#151b25;border:1px solid #343d4a;border-radius:18px;overflow:hidden}.hero{position:relative;min-height:230px;background:linear-gradient(125deg,#19394c,#31594a);display:flex;align-items:center;justify-content:center}.hero img{display:block;width:100%;max-height:490px;object-fit:contain}.placeholder{display:flex;flex-direction:column;align-items:center;gap:12px;padding:45px 20px;text-align:center}.placeholder .emoji{font-size:64px}.photo-label{position:absolute;bottom:12px;left:12px;background:#10212be8;padding:6px 10px;border-radius:7px;font-size:12px}.body{padding:clamp(20px,4vw,34px)}.meta{display:flex;flex-wrap:wrap;gap:8px}.pill{background:#263e32;color:#c9f48a;padding:7px 10px;border-radius:7px;font-size:13px;font-weight:750}.pill.date{background:#15221d;border:1px solid #8ead62;color:#fff}h1{font-size:clamp(27px,5vw,42px);line-height:1.15;overflow-wrap:anywhere;margin:20px 0}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:24px 0}.detail{background:#1d2a34;border-radius:10px;padding:15px}.detail small{display:block;color:#aeb9c8;margin-bottom:7px}.detail strong{overflow-wrap:anywhere}.note{color:#c4d2d8;line-height:1.6}.cta{display:block;text-align:center;background:#c9f48a;color:#15221d;text-decoration:none;padding:17px 22px;border-radius:12px;font-size:17px;font-weight:850;margin-top:28px}.cta:focus-visible,.back:focus-visible{outline:3px solid #fff;outline-offset:4px}.disclaimer{font-size:12px;color:#aeb9c8;margin-top:15px;line-height:1.5}.error{padding:36px}@media(max-width:540px){.details{grid-template-columns:1fr}.hero{min-height:180px}}
</style></head><body><header><div class="wrap"><a class="brand" href="./index.html">partiu<span>floripa.</span></a></div></header><main class="wrap"><a class="back" href="./index.html">← Voltar à agenda</a><div id="detail" class="panel" aria-live="polite"><p class="error">Carregando evento...</p></div></main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icons={"Baladas":"🪩","Shows":"🎤","Humor":"😂","Teatro":"🎭","Cinema":"🎬","Dança":"💃","Festivais":"🎪","Feiras":"🛍️","Cultura":"📚"};
const venueImages={"Bar do Espartano":"./images/66b79f7b747f8c3c.webp"};
const qs=new URLSearchParams(location.search);
const id=qs.get("id")||document.documentElement.dataset.eventId,date=qs.get("date"),title=qs.get("title"),venue=qs.get("venue");
const detail=document.getElementById("detail");
function show(e){document.title=e.title+" — PartiuFloripa";const image="";const housePhoto=false;const emoji=icons[e.category]||"📅";const hero=image?'<img src="'+esc(image)+'" alt="'+(housePhoto?'Identidade visual de '+esc(e.venue):'Imagem de divulgação do evento')+'" onerror="this.remove();document.getElementById(\'hero\').insertAdjacentHTML(\'beforeend\',\'<div class=placeholder>Imagem indisponível</div>\')">':'<div class="placeholder"><span class="emoji" aria-hidden="true">'+emoji+'</span><strong>'+esc(e.venue)+'</strong><span>Imagem do evento indisponível</span></div>';const day=new Intl.DateTimeFormat("pt-BR",{dateStyle:"full",timeZone:"UTC"}).format(new Date(e.date+"T12:00:00Z"));detail.innerHTML='<div class="hero" id="hero">'+hero+(housePhoto?'<span class="photo-label">Imagem da casa</span>':'')+'</div><div class="body"><div class="meta"><span class="pill">'+emoji+' '+esc(e.category)+'</span><span class="pill date">'+esc(day)+'</span></div><h1>'+esc(e.title)+'</h1><div class="details"><div class="detail"><small>📍 Local</small><strong>'+esc(e.venue||"A confirmar")+'</strong><div>'+esc(e.region||"Florianópolis")+' · Florianópolis</div></div><div class="detail"><small>🕒 Horário</small><strong>'+esc(e.time||"A confirmar")+'</strong>'+(e.showTime?'<div style="margin-top:8px">Início do show: '+esc(e.showTime)+'</div>':'')+'</div><div class="detail"><small>💵 Ingressos</small><strong>'+esc(e.price||"Consultar valores na fonte oficial")+'</strong></div><div class="detail"><small>Categoria</small><strong>'+emoji+' '+esc(e.category)+'</strong></div></div>'+(e.note?'<p class="note">'+esc(e.note)+'</p>':'')+'<a class="cta" href="'+esc(e.source)+'" target="_blank" rel="noopener noreferrer">Ver evento na página oficial ↗</a><p class="disclaimer">Informações sujeitas a alterações. Consulte a fonte oficial para preços, ingressos, disponibilidade e confirmação do evento. O PartiuFloripa não vende ingressos.</p></div>'}
fetch("./events.json").then(r=>{if(!r.ok)throw Error("Falha ao carregar");return r.json()}).then(data=>{const e=data.events.find(e=>id?e.id===id:(e.date===date&&e.title===title&&e.venue===venue));if(!e){detail.innerHTML='<p class="error">Evento não encontrado. <a href="./index.html">Voltar à agenda</a>.</p>';return}if(!/^https:\/\//.test(e.source)){detail.innerHTML='<p class="error">Fonte do evento indisponível.</p>';return}show(e)}).catch(()=>{detail.innerHTML='<p class="error">Não foi possível carregar os detalhes. Tente novamente.</p>'});
</script></body></html>
