<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Evento — PartiuFloripa</title><meta name="description" content="Detalhes de eventos em Florianópolis no PartiuFloripa"><meta name="robots" content="noindex,follow"><style>
:root{font-family:Inter,system-ui,sans-serif;color:#f0f3f7;background:#0c151b}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:0 20px}header{background:#0b1218;border-bottom:1px solid #30424a;padding:20px 0}.brand{text-decoration:none;font-size:24px;font-weight:900;letter-spacing:-1px;color:white}.brand span{color:#5ce5ba}main{padding-top:28px;padding-bottom:70px}.back{display:inline-block;color:#c9f48a;margin-bottom:24px;text-decoration:none}.panel{background:#151b25;border:1px solid #343d4a;border-radius:18px;overflow:hidden}.hero{position:relative;min-height:230px;background:linear-gradient(125deg,#19394c,#31594a);display:flex;align-items:center;justify-content:center}.hero img{display:block;width:100%;max-height:490px;object-fit:contain}.placeholder{display:flex;flex-direction:column;align-items:center;gap:12px;padding:45px 20px;text-align:center}.placeholder .emoji{font-size:64px}.photo-label{position:absolute;bottom:12px;left:12px;background:#10212be8;padding:6px 10px;border-radius:7px;font-size:12px}.body{padding:clamp(20px,4vw,34px)}.meta{display:flex;flex-wrap:wrap;gap:8px}.pill{background:#263e32;color:#c9f48a;padding:7px 10px;border-radius:7px;font-size:13px;font-weight:750}.pill.date{background:#15221d;border:1px solid #8ead62;color:#fff}h1{font-size:clamp(27px,5vw,42px);line-height:1.15;overflow-wrap:anywhere;margin:20px 0}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:24px 0}.detail{background:#1d2a34;border-radius:10px;padding:15px}.detail small{display:block;color:#aeb9c8;margin-bottom:7px}.detail strong{overflow-wrap:anywhere}.note{color:#c4d2d8;line-height:1.6}.cta{display:block;text-align:center;background:#c9f48a;color:#15221d;text-decoration:none;padding:17px 22px;border-radius:12px;font-size:17px;font-weight:850;margin-top:28px}.cta:focus-visible,.back:focus-visible{outline:3px solid #fff;outline-offset:4px}.disclaimer{font-size:12px;color:#aeb9c8;margin-top:15px;line-height:1.5}.review-note{background:#1e3038;color:#c4e3e4;border-left:3px solid #5ce5ba;border-radius:8px;padding:12px 14px;margin:17px 0;line-height:1.5}.field-warning{background:#3f2e22;color:#ffe2b3;border:1px solid #6a4c2d;border-radius:9px;padding:12px 14px;margin:12px 0;line-height:1.5}.location-text,.extra-time{display:block;color:#b2c8d0;margin-top:8px;line-height:1.5}.hero{background:radial-gradient(circle at 20% 25%,#255768,transparent 55%),linear-gradient(130deg,#173342,#1a4e40)}.hero .emoji{filter:drop-shadow(0 7px 18px #0006)}.pill{border-radius:100px}.detail{border:1px solid #34464d}.cta:hover{background:#e4ffaa}.cta:focus-visible{outline:3px solid #fff;outline-offset:3px}.error{padding:36px}@media(max-width:540px){.details{grid-template-columns:1fr}.hero{min-height:180px}}
</style></head><body><header><div class="wrap"><a class="brand" href="./index.html">partiu<span>floripa.</span></a></div></header><main class="wrap"><a class="back" href="./index.html">← Voltar à agenda</a><div id="detail" class="panel" aria-live="polite"><p class="error">Carregando evento...</p></div></main><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icons={"Baladas":"🪩","Shows":"🎤","Humor":"😂","Teatro":"🎭","Cinema":"🎬","Dança":"💃","Festivais":"🎪","Feiras":"🛍️","Cultura":"📚"};
const venueImages={"Bar do Espartano":"./images/66b79f7b747f8c3c.webp"};
const qs=new URLSearchParams(location.search);
const id=qs.get("id")||document.documentElement.dataset.eventId,date=qs.get("date"),title=qs.get("title"),venue=qs.get("venue");
const detail=document.getElementById("detail");
function show(e){
  document.title=e.title+" — PartiuFloripa";
  const emoji=icons[e.category]||"📅";
  const day=new Intl.DateTimeFormat("pt-BR",{dateStyle:"full",timeZone:"UTC"}).format(new Date(e.date+"T12:00:00Z"));
  const reviewed=e.status==="verified";
  const underReview=e.sourceReview==="quarantined";
  const uncertain=[];
  if(!e.time)uncertain.push("Horário não confirmado");
  if(!e.venue||e.venue==="Local a confirmar")uncertain.push("Local não confirmado");
  if(!e.region||e.region==="Florianópolis")uncertain.push("Bairro não confirmado");
  const hero='<div class="placeholder"><span class="emoji" aria-hidden="true">'+emoji+'</span><strong>'+esc(e.category)+'</strong><span>Arte ilustrativa da categoria</span></div>';
  const label=e.showTime?"Abertura do evento":"Horário informado";
  const warning=uncertain.length?'<div class="field-warning" role="note">⚠ '+uncertain.map(esc).join(" · ")+'</div>':"";
  const reviewNote=!reviewed?'<div class="review-note" role="note">Informações do catálogo experimental. Este registro ainda não consta como validado individualmente.</div>':"";
  const quarantined=underReview?'<div class="field-warning" role="note">Fonte sob revisão editorial. Consulte o organizador antes de se deslocar.</div>':"";
  const schedule='<div class="detail"><small>🕒 '+label+'</small><strong>'+esc(e.time||"A confirmar")+'</strong>'+(e.showTime?'<span class="extra-time">Início da atração: <strong>'+esc(e.showTime)+'</strong></span>':'')+'</div>';
  const source=underReview?'':'<a class="cta" href="'+esc(e.source)+'" target="_blank" rel="noopener noreferrer">Consultar informações na fonte ↗</a>';
  detail.innerHTML='<div class="hero" id="hero">'+hero+'</div><div class="body"><div class="meta"><span class="pill">'+emoji+' '+esc(e.category)+'</span><span class="pill date">'+esc(day)+'</span></div><h1>'+esc(e.title)+'</h1>'+reviewNote+warning+quarantined+'<div class="details"><div class="detail"><small>📍 Local</small><strong>'+esc(e.venue||"A confirmar")+'</strong><span class="location-text">'+esc(e.region&&e.region!=="Florianópolis"?e.region:"Bairro a confirmar")+' · Florianópolis</span></div>'+schedule+'<div class="detail"><small>💵 Ingressos</small><strong>'+esc(e.price||"Consultar na fonte")+'</strong></div><div class="detail"><small>Categoria</small><strong>'+emoji+' '+esc(e.category)+'</strong></div></div>'+(e.note?'<p class="note">'+esc(e.note)+'</p>':'')+source+'<p class="disclaimer">Informações sujeitas a alterações. Verifique com o organizador data, ingressos e disponibilidade. O PartiuFloripa não comercializa ingressos.</p></div>';
}
fetch("./events.json").then(r=>{if(!r.ok)throw Error("Falha ao carregar");return r.json()}).then(data=>{const e=data.events.find(e=>id?e.id===id:(e.date===date&&e.title===title&&e.venue===venue));if(!e){detail.innerHTML='<p class="error">Evento não encontrado. <a href="./index.html">Voltar à agenda</a>.</p>';return}if(!/^https:\/\//.test(e.source)){detail.innerHTML='<p class="error">Fonte do evento indisponível.</p>';return}show(e)}).catch(()=>{detail.innerHTML='<p class="error">Não foi possível carregar os detalhes. Tente novamente.</p>'});
</script></body></html>
