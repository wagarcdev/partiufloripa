name: Review PartiuFloripa changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.cjs
      - run: node scripts/validate-events.cjs
      - run: node scripts/test-venue-location.cjs
      - run: node scripts/test-image-rights.cjs
      - run: node scripts/test-licensed-photos.cjs
      - run: node scripts/test-media-selection.cjs
      - run: node scripts/test-map-popup.cjs
      - run: node scripts/test-audit-catalogue.cjs
      - run: node scripts/generate-event-pages.cjs
