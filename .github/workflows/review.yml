name: Review PartiuFloripa changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.cjs
      - run: node scripts/validate-events.cjs
      - run: node scripts/test-venue-location.cjs
      - run: node scripts/test-image-rights.cjs
      - run: node scripts/test-licensed-photos.cjs
      - run: node scripts/test-media-selection.cjs
      - run: node scripts/test-map-popup.cjs
      - run: node scripts/test-audit-catalogue.cjs
      - run: node scripts/generate-event-pages.cjs
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/generate-event-pages.cjs
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/partiufloripa-http.log 2>&1 &
          for i in {1..15}; do curl -sf http://127.0.0.1:8765/index.html > /dev/null && exit 0; sleep 1; done
          cat /tmp/partiufloripa-http.log
          exit 1
      - run: node scripts/qa-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partiu-browser-qa-${{ github.run_id }}
          path: out/browser-qa/
          retention-days: 7
          if-no-files-found: warn
