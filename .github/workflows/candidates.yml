name: Validate candidate reconciliation
on:
  push:
    paths:
      - 'scripts/reconcile-candidates.cjs'
      - 'scripts/test-reconcile-candidates.cjs'
      - 'scripts/prepare-review-queue.cjs'
      - 'scripts/test-review-queue.cjs'
      - 'data/source-registry.json'
      - '.github/workflows/candidates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-reconcile-candidates.cjs
      - run: node scripts/test-review-queue.cjs
      - run: node scripts/check-site.cjs
