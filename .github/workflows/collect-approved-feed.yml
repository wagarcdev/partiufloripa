name: Collect approved event feed (manual)
on:
  workflow_dispatch:
    inputs:
      source_id:
        description: 'Approved source ID from data/source-registry.json'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: collect-${{ inputs.source_id }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-approved-feed.cjs
      - name: Fetch approved JSON feed
        env:
          SOURCE_ID: ${{ inputs.source_id }}
        run: node scripts/collect-approved-feed.cjs "$SOURCE_ID" out/candidates.json
      - run: node scripts/reconcile-candidates.cjs out/candidates.json out/reconciliation.json
      - run: node scripts/prepare-review-queue.cjs out/candidates.json out/review.json
      - uses: actions/upload-artifact@v4
        with:
          name: event-review-${{ github.run_id }}
          path: out/*.json
          retention-days: 7
          if-no-files-found: error
